  </div>

<div id="geschichte-inhalt" style="display:none;">

          <button id="teilen-btn" class="btn btn-outline" style="font-size:.85rem; padding:.6em 1.2em; cursor:pointer;">
            <span id="teilen-btn-text">Diese Geschichte teilen</span>
